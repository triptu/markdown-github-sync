\* Positive: devices edit disjoint files, no external writer; must converge with no conflict decision ever needed.
SPECIFICATION LiveSpec
CONSTANTS
  d1 = d1
  d2 = d2
  f1 = f1
  f2 = f2
  Devices = {d1, d2}
  Files = {f1, f2}
  Owner <- DisjointOwner
  MaxEnv = 3
  MaxCommits = 6
  AllowRewind = FALSE
  AllowExternal = FALSE
  AllowQuiescence = TRUE
  NC_NoApplyGuard = FALSE
  NC_NoApplyJournal = FALSE
  NC_PartialCheckpoint = FALSE
  NC_OptimisticCheckpoint = FALSE
  NC_ReplayOnUnknown = FALSE
  NC_StaleResolution = FALSE
  NC_SilentNewDraft = FALSE
  NC_DiscardOnUseGitHub = FALSE
  NC_FastForwardRef = FALSE
  NC_ForgetSiblings = FALSE
INVARIANTS
  TypeOK
  CommitBoundSlack
  NeverResolving
  CapturedEditsPreserved
  BaseCoherent
PROPERTIES
  Convergence
CHECK_DEADLOCK FALSE

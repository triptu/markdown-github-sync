\* Positive: owner may rewind main; devices must pause, keep drafts, and never resurrect removed commits.
SPECIFICATION Spec
CONSTANTS
  Devices = {d1, d2}
  Files = {f1, f2}
  Owner <- AllFilesOwner
  MaxEnv = 3
  MaxCommits = 6
  AllowRewind = TRUE
  AllowExternal = TRUE
  AllowQuiescence = FALSE
  NC_NoApplyGuard = FALSE
  NC_NoApplyJournal = FALSE
  NC_PartialCheckpoint = FALSE
  NC_OptimisticCheckpoint = FALSE
  NC_ReplayOnUnknown = FALSE
  NC_StaleResolution = FALSE
  NC_SilentNewDraft = FALSE
  NC_DiscardOnUseGitHub = FALSE
  NC_FastForwardRef = FALSE
  NC_ForgetSiblings = FALSE
SYMMETRY Symm
INVARIANTS
  TypeOK
  CommitBoundSlack
  CheckpointEverPublished
  LiveIsCommittedOrOwnEver
  BaseCoherent
  CapturedEditsPreservedEver
  NoBlindOverwrite
  NoUnauthoredChange
  NoReplay
  NoResurrection
  NoUncertainRetry
  HeldHasCandidates
CHECK_DEADLOCK FALSE

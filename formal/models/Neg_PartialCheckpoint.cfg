\* NEGATIVE CONTROL (must violate BaseCoherent): per-file checkpoint advance -> live files no longer match the checkpoint and stale content is treated as a draft
SPECIFICATION Spec
CONSTANTS
  Devices = {d1, d2}
  Files = {f1, f2}
  Owner <- AllFilesOwner
  MaxEnv = 3
  MaxCommits = 6
  AllowRewind = FALSE
  AllowExternal = TRUE
  AllowQuiescence = FALSE
  NC_NoApplyGuard = FALSE
  NC_NoApplyJournal = FALSE
  NC_PartialCheckpoint = TRUE
  NC_OptimisticCheckpoint = FALSE
  NC_ReplayOnUnknown = FALSE
  NC_StaleResolution = FALSE
  NC_SilentNewDraft = FALSE
  NC_DiscardOnUseGitHub = FALSE
  NC_FastForwardRef = FALSE
  NC_ForgetSiblings = FALSE
SYMMETRY Symm
INVARIANTS
  BaseCoherent
CHECK_DEADLOCK FALSE

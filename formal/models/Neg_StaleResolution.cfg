\* NEGATIVE CONTROL (must violate NoBlindOverwrite): conflict decision reused against a changed remote value -> publication over content the user never reviewed
SPECIFICATION Spec
CONSTANTS
  Devices = {d1, d2}
  Files = {f1, f2}
  Owner <- AllFilesOwner
  MaxEnv = 3
  MaxCommits = 6
  AllowRewind = FALSE
  AllowExternal = TRUE
  AllowQuiescence = FALSE
  NC_NoApplyGuard = FALSE
  NC_NoApplyJournal = FALSE
  NC_PartialCheckpoint = FALSE
  NC_OptimisticCheckpoint = FALSE
  NC_ReplayOnUnknown = FALSE
  NC_StaleResolution = TRUE
  NC_SilentNewDraft = FALSE
  NC_DiscardOnUseGitHub = FALSE
  NC_FastForwardRef = FALSE
  NC_ForgetSiblings = FALSE
SYMMETRY Symm
INVARIANTS
  NoBlindOverwrite
CHECK_DEADLOCK FALSE

\* NEGATIVE CONTROL (must violate NoBlindOverwrite): newer local edit found during apply becomes an ordinary draft -> the remote change it hides is overwritten unseen
SPECIFICATION Spec
CONSTANTS
  Devices = {d1, d2}
  Files = {f1, f2}
  Owner <- AllFilesOwner
  MaxEnv = 3
  MaxCommits = 6
  AllowRewind = FALSE
  AllowExternal = TRUE
  AllowQuiescence = FALSE
  NC_NoApplyGuard = FALSE
  NC_NoApplyJournal = FALSE
  NC_PartialCheckpoint = FALSE
  NC_OptimisticCheckpoint = FALSE
  NC_ReplayOnUnknown = FALSE
  NC_StaleResolution = FALSE
  NC_SilentNewDraft = TRUE
  NC_DiscardOnUseGitHub = FALSE
  NC_FastForwardRef = FALSE
  NC_ForgetSiblings = FALSE
SYMMETRY Symm
INVARIANTS
  NoBlindOverwrite
CHECK_DEADLOCK FALSE

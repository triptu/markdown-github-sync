\* NEGATIVE CONTROL (must violate CapturedEditsPreserved): Use GitHub drops the draft without a recovery copy -> the captured edit is lost
SPECIFICATION Spec
CONSTANTS
  Devices = {d1, d2}
  Files = {f1, f2}
  Owner <- AllFilesOwner
  MaxEnv = 3
  MaxCommits = 6
  AllowRewind = FALSE
  AllowExternal = TRUE
  AllowQuiescence = FALSE
  NC_NoApplyGuard = FALSE
  NC_NoApplyJournal = FALSE
  NC_PartialCheckpoint = FALSE
  NC_OptimisticCheckpoint = FALSE
  NC_ReplayOnUnknown = FALSE
  NC_StaleResolution = FALSE
  NC_SilentNewDraft = FALSE
  NC_DiscardOnUseGitHub = TRUE
  NC_FastForwardRef = FALSE
  NC_ForgetSiblings = FALSE
SYMMETRY Symm
INVARIANTS
  CapturedEditsPreserved
CHECK_DEADLOCK FALSE

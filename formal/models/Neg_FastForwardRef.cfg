\* NEGATIVE CONTROL (must violate NoResurrection): fast-forward-only ref update after an owner rewind -> removed history silently comes back
SPECIFICATION Spec
CONSTANTS
  Devices = {d1, d2}
  Files = {f1, f2}
  Owner <- AllFilesOwner
  MaxEnv = 3
  MaxCommits = 6
  AllowRewind = TRUE
  AllowExternal = TRUE
  AllowQuiescence = FALSE
  NC_NoApplyGuard = FALSE
  NC_NoApplyJournal = FALSE
  NC_PartialCheckpoint = FALSE
  NC_OptimisticCheckpoint = FALSE
  NC_ReplayOnUnknown = FALSE
  NC_StaleResolution = FALSE
  NC_SilentNewDraft = FALSE
  NC_DiscardOnUseGitHub = FALSE
  NC_FastForwardRef = TRUE
  NC_ForgetSiblings = FALSE
SYMMETRY Symm
INVARIANTS
  NoResurrection
CHECK_DEADLOCK FALSE
